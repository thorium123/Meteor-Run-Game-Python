name: Build macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install pygame pyinstaller

      - run: |
          pyinstaller --onefile --hidden-import pygame \
            --add-data "Music:Music" \
            --add-data "Images:Images" \
            main.py

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/main
